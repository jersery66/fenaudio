<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fenaudio - 个性化AI电台</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#7c6cf6">
</head>
<body>
  <canvas id="particle-canvas"></canvas>
  <div id="cursor-glow"></div>
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-area">
          <div class="logo-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
            </svg>
          </div>
          <div>
            <h1>fenaudio</h1>
            <p>AI Radio</p>
          </div>
        </div>
        <button class="icon-btn float-toggle" id="floatToggle" title="悬浮窗模式">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 2v20"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-search">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="搜索歌曲、歌手..." />
      </div>

      <div class="sidebar-nav">
        <button class="active" data-tab="playlist" title="歌单">
          <svg class="nav-icon outline" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10"/><path d="M3 15h18v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4z"/></svg>
          <svg class="nav-icon filled" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21 15V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10"/><rect x="3" y="15" width="18" height="6" rx="2"/></svg>
          <span>歌单</span>
        </button>
        <button data-tab="tracks" title="曲库">
          <svg class="nav-icon outline" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="nav-icon filled" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="var(--bg-primary)"/></svg>
          <span>曲库</span>
        </button>
        <button data-tab="recommend" title="推荐">
          <svg class="nav-icon outline" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <svg class="nav-icon filled" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>推荐</span>
        </button>
        <button data-tab="search" title="搜索">
          <svg class="nav-icon outline" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <svg class="nav-icon filled" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.71 19.29l-3.4-3.39A7.92 7.92 0 0019 11a8 8 0 10-8 8 7.92 7.92 0 004.9-1.69l3.39 3.4a1 1 0 001.42-1.42zM5 11a6 6 0 116 6 6 6 0 01-6-6z"/></svg>
          <span>搜索</span>
        </button>
        <button data-tab="history" title="历史">
          <svg class="nav-icon outline" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <svg class="nav-icon filled" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16z"/><path d="M12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>
          <span>历史</span>
        </button>
      </div>

      <div class="sidebar-content" id="sidebarContent">
        <div class="empty-state">
          <div class="empty-icon">🎵</div>
          <p>还没有导入歌单<br>点击"导入歌单"开始</p>
        </div>
      </div>

      <div class="sidebar-login" id="sidebarLogin">
        <button class="login-btn" id="loginBtn" onclick="app.showLoginModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>登录网易云</span>
        </button>
      </div>
    </aside>

    <main class="main-content" id="mainContent">
      <div class="player-lyrics-area">
        <div class="now-playing" id="nowPlaying">
          <div class="bg-blur" id="bgBlur"></div>
          <div class="player-inner">
            <div class="album-section">
              <div class="album-art-wrapper" id="albumWrapper">
                <div class="album-art-glow" id="albumArtGlow"></div>
                <div class="vinyl-disc">
                  <div class="vinyl-grooves"></div>
                  <div class="vinyl-shine"></div>
                  <div class="vinyl-label">
                    <div class="album-art-placeholder" id="albumPlaceholder">
                      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    </div>
                    <img class="album-art" id="albumArt" style="display:none" alt="album art">
                  </div>
                  <div class="vinyl-center-hole"></div>
                </div>
              </div>
              <canvas id="audioVisualizer"></canvas>
            </div>

            <div class="song-controls-section">
              <div class="song-info">
                <div class="title" id="songTitle">等待播放</div>
                <div class="artist-album" id="songArtist">选择一首歌开始聆听</div>
              </div>

              <div class="progress-bar" id="progressBar">
                <span class="time" id="currentTime">0:00</span>
                <div class="bar">
                  <div class="fill" id="progressFill"></div>
                  <div class="handle" id="progressHandle"></div>
                </div>
                <span class="time" id="totalTime">0:00</span>
              </div>

              <div class="controls">
                <button class="ctrl-btn mode-btn" id="modeBtn" title="列表循环">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
                </button>
                <button class="ctrl-btn skip-btn prev" id="prevBtn">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="ctrl-btn play-btn" id="playBtn">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </button>
                <button class="ctrl-btn skip-btn next" id="nextBtn">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <div class="volume-group">
                  <button class="ctrl-btn volume-btn" id="volumeBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
                  </button>
                  <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="lyric-panel collapsed" id="lyricPanel">
          <div class="lyric-header">
            <span>歌词</span>
            <button class="lyric-toggle" id="lyricToggle" title="展开/收起歌词">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </div>
          <div class="lyric-content" id="lyricContent">
            <p class="lyric-line placeholder">播放歌曲后显示歌词</p>
          </div>
        </div>
      </div>

      <div class="chat-panel" id="chatPanel">
        <div class="chat-header" id="chatHeader">
          <div class="chat-title">
            <div class="chat-avatar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            </div>
            <span>和小芬聊天</span>
          </div>
          <div class="chat-actions">
            <button class="action-btn radio-btn" id="radioBtn" title="电台模式">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
              <span>电台</span>
            </button>
            <button class="action-btn tts-toggle" id="ttsToggle" title="语音播报">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>
              <span>语音</span>
            </button>
            <button class="action-btn chat-toggle" id="chatToggle" title="展开/收起聊天">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </div>
        </div>
        <div class="chat-messages" id="chatMessages">
          <div class="chat-msg assistant">
            <div class="msg-avatar">芬</div>
            <div class="msg-body">你好！我是小芬 🎵 你的AI音乐DJ。告诉我你的心情、场景，或者想听什么风格的音乐，我来为你推荐！<br><br>
            试试说：<br>
            • "推荐一首适合下雨天听的歌"<br>
            • "我想听点轻松的爵士乐"<br>
            • "今天心情不太好，给我点安慰"</div>
          </div>
        </div>
        <div class="chat-input-area">
          <input type="text" id="chatInput" placeholder="告诉小芬你想听什么..." />
          <button id="chatSendBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <div class="float-player" id="floatPlayer" style="display:none">
    <div class="float-drag-area" id="floatDragArea">
      <div class="float-cover" id="floatCover">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div class="float-info">
        <div class="float-title" id="floatTitle">未播放</div>
        <div class="float-artist" id="floatArtist">--</div>
        <div class="float-progress-mini">
          <div class="float-progress-fill" id="floatProgressFill"></div>
        </div>
      </div>
      <div class="float-controls">
        <button class="float-btn" id="floatPrev" title="上一首">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="float-btn float-play" id="floatPlay" title="播放/暂停">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" id="floatPlayIcon"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
        <button class="float-btn" id="floatNext" title="下一首">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <button class="float-expand" id="floatExpand" title="展开完整界面">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
    </div>
  </div>

  <div class="vip-toast" id="vipToast" style="display:none">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="vipToastText">该歌曲为VIP专属，请在.env中配置NETEASE_COOKIE</span>
  </div>

  <div class="radio-mode-indicator" id="radioIndicator" style="display:none">
    <div class="radio-dot"></div>
    <span>电台模式</span>
  </div>

  <script src="/js/particles.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
